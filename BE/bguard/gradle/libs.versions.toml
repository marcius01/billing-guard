[versions]
lombok = "1.18.46"
spring-boot = "4.0.6"
spring-management = "1.1.7"
postgres-version = "42.7.11"
mapstruct-version = "1.6.3"
open-csv = "5.12.0"
open-api = "3.0.3"
testcontainer-bom-version = "2.0.5"

[libraries]
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
spring-boot-web = { module = "org.springframework.boot:spring-boot-starter-web", version.ref = "spring-boot" }
spring-boot-devtools = {module = "org.springframework.boot:spring-boot-devtools", version.ref = "spring-boot"}
spring-boot-jpa = {module="org.springframework.boot:spring-boot-starter-data-jpa", version.ref ="spring-boot"}
spring-boot-jpa-test = {module="org.springframework.boot:spring-boot-starter-data-jpa-test", version.ref ="spring-boot"}
spring-boot-webmvc-test = {module="org.springframework.boot:spring-boot-starter-webmvc-test", version.ref ="spring-boot"}
spring-boot-test = {module="org.springframework.boot:spring-boot-starter-test", version.ref ="spring-boot"}
spring-security = {module="org.springframework.boot:spring-boot-starter-security", version.ref ="spring-boot"}
bean-validation = {module="org.springframework.boot:spring-boot-starter-validation", version.ref="spring-boot"}
postgres-driver = {module="org.postgresql:postgresql", version.ref="postgres-version"}
mapstruct = {module="org.mapstruct:mapstruct", version.ref="mapstruct-version"}
mapstruct-processor = {module="org.mapstruct:mapstruct-processor", version.ref="mapstruct-version"}
open-csv = {module="com.opencsv:opencsv", version.ref="open-csv"}
open-api = {module="org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref="open-api"}
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-postgres = { module = "org.flywaydb:flyway-database-postgresql" }
flyway-spring = { module = "org.springframework.boot:spring-boot-flyway" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers", version.ref = "spring-boot" }
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-starter-kafka = { module = "org.springframework.boot:spring-boot-starter-kafka", version.ref = "spring-boot" }

testcontainer-bom = {module = "org.testcontainers:testcontainers-bom", version.ref="testcontainer-bom-version"}

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-management" }


