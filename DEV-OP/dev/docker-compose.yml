name: billing-guard

services:
  bguard-db:
    image: ${DB_IMAGE_NAME}
    container_name: ${DB_CONTAINER_NAME}
    network_mode: bridge
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      ALLOW_IP_RANGE: 0.0.0.0/0
    ports:
      - ${DB_PORT}:5432
    volumes:
      - ${DATA_DIR:-./data}:/var/lib/postgresql/
    restart: always
